<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Current Project</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='main.css') }}"
    />
    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  </head>
  <body>
    <h1>Current Project</h1>
    <h2>{{ project_name }}</h2>
    <ul>
      <li>
        <a href="{{ url_for('project_page') }}">Change Current Project</a>
      </li>
      <li>
        <a href="{{ url_for('open_folder') }}">Open Folder In Explorer</a>
      </li>
      <li {% if has_renamed %}class="project-folder" {% endif %}>
        <a href="#" onclick="executeAction('{{ url_for('rename_files') }}', 'Renaming videos...')">Rename Videos</a>
      </li>
      <li {% if has_video_details %}class="project-folder" {% endif %}>
        <a href="#" onclick="executeAction('{{ url_for('generate_csv') }}', 'Creating edit data...')">Create Edit Data</a>
      </li>
      <li {% if has_video_details %}class="project-folder" {% endif %}>
        <a href="{{ url_for('edit_csv') }}">Edit Data</a>
      </li>
      <li {% if has_trimmed_videos %} class="project-folder" {% endif %}>
        <a href="#" onclick="executeAction('{{ url_for('trim_videos') }}', 'Trimming videos...')">Trim Videos</a>
      </li>
      <li {% if has_upscaled_videos %} class="project-folder" {% endif %}>
        <a href="#" onclick="executeAction('{{ url_for('move_trimmed_to_upscaled') }}', 'Moving files to upscaled folder...')"
          >Bypass Upscale (Or AI Upscale Videos into /upscale)</a
        >
      </li>
      <li {% if has_combined_video %} class="project-folder" {% endif %}>
        <a href="#" onclick="executeAction('{{ url_for('combine_videos') }}', 'Combining videos...')">Combine into Final Video</a>
      </li>
      <li {% if has_final_output %} class="project-folder" {% endif %}>
        <a href="#" onclick="executeAction('{{ url_for('inject_video') }}', 'Injecting metadata...')">Inject Metadata</a>
      </li>
    </ul>
    
    <script>
      function executeAction(url, message) {
        createModal(message);
        
        fetch(url, {
          method: 'GET'
        })
        .then(response => response.text())
        .then(html => {
          // Check if the response contains success indicators
          if (html.includes('<h2>Success!</h2>') || html.includes('success=True') || html.includes('"success": true')) {
            setRefreshModalPrompt('Operation completed successfully!');
          } else if (html.includes('<h2>Something went wrong:</h2>') || html.includes('error') || html.includes('Error')) {
            // Extract error message if possible
            const errorMatch = html.match(/<p>([^<]+)<\/p>/);
            const errorMessage = errorMatch ? errorMatch[1] : 'An error occurred';
            setRefreshModalPrompt('Error: ' + errorMessage);
          } else {
            setRefreshModalPrompt('Operation completed!');
          }
        })
        .catch(error => {
          setRefreshModalPrompt('Error: ' + error.message);
        });
      }
    </script>
  </body>
</html>
